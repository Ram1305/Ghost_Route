name: ghost_route
description: Ghost Route – secure VPN with account management and subscriptions.
publish_to: 'none'

# App Version
version: 2.0.0+2

environment:
  sdk: ^3.6.1

# App dependencies
dependencies:
  flutter:
    sdk: flutter

  # Getx for state management
  get: ^4.7.2

  # Cupertino style icons
  cupertino_icons: ^1.0.8

  # For API Call
  http: ^1.3.0

  # In-App Purchase (App Store & Google Play)
  in_app_purchase: ^3.2.0

  # Privacy policy & support links
  url_launcher: ^6.3.1

  # For Lottie Animation
  lottie: ^3.3.1

  # Google Fonts (Outfit, JetBrains Mono)
  google_fonts: ^6.2.1

  # For storing data (in local storage) 
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # For firebase
  firebase_core: ^3.12.1

  # For Remote Config
  firebase_remote_config: ^5.4.2

  # OpenVPN for both Android and iOS
  openvpn_flutter: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Launcher icon from logo
  flutter_launcher_icons: ^0.14.3

  # Encourages good practices
  flutter_lints: ^5.0.0

# Generate launcher icons from assets/images/logo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  # Enabling material design
  uses-material-design: true

  # App assets
  assets:
    - assets/
    - assets/vpn/
    - assets/images/
    - assets/lottie/
    - assets/flags/
